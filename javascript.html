<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript-01</title>
</head>
<body>

    <h1 class="title" id="title"></h1>
    <p class="description" id="description"></p>
    <button id="button">Click Me!</button>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Major</th>
        </tr>
        <tr>
            <td id="student-name"></td>
            <td id="student-age"></td>
            <td id="student-major"></td>
        </tr>
        </table>

    <script>
        document.getElementById("title").textContent = "JavaScript Basics";
        document.getElementById("description").textContent = "This is a simple introduction to JavaScript.";
        document.getElementById("button").addEventListener("click", function() {
            alert("Button clicked!");
        });

        const student = {
            name: "John Doe",
            age: 20,
            major: "Computer Science"
        };
        document.getElementById("student-name").textContent = student.name;
        document.getElementById("student-age").textContent = student.age;
        document.getElementById("student-major").textContent = student.major;

        document.querySelector("body").style.backgroundColor = "#f0f0f0";
        document.querySelector("body").style.fontFamily = "Arial, sans-serif";
        document.querySelector("h1").style.color = "#333";
        document.querySelector("p").style.color = "#666";
        document.querySelector("button").style.padding = "10px 20px";
        document.querySelector("button").style.backgroundColor = "#007BFF";
        document.querySelector("button").style.color = "#fff";
        document.querySelector("button").style.border = "none";
        document.querySelector("button").style.borderRadius = "5px";
        document.querySelector("button").style.cursor = "pointer";
        document.querySelector("button").addEventListener("mouseover", function() {
            this.style.backgroundColor = "#0056b3";
        });
        document.querySelector("button").addEventListener("mouseout", function() {
            this.style.backgroundColor = "#007BFF";
        });
        document.querySelector("table").style.width = "100%";
        document.querySelector("table").style.borderCollapse = "collapse";
        document.querySelector("th, td").style.border = "1px solid #ddd";
        document.querySelector("th, td").style.padding = "8px";
        document.querySelector("th").style.backgroundColor = "#f2f2f2";
        document.querySelector("th").style.textAlign = "left";
        document.querySelector("tr:nth-child(even)").style.backgroundColor = "#f9f9f9";
        document.querySelector("tr:hover").style.backgroundColor = "#f1f1f1";
        document.querySelector("th").style.color = "#333";
        document.querySelector("td").style.color = "#666";
        document.querySelector("td").style.textAlign = "left";
        document.querySelector("td").style.fontSize = "14px";
        document.querySelector("td").style.fontWeight = "normal";
        document.querySelector("td").style.lineHeight = "1.5";
        document.querySelector("td").style.verticalAlign = "top";
        document.querySelector("td").style.paddingTop = "10px";
        document.querySelector("td").style.paddingBottom = "10px";
        document.querySelector("td").style.paddingLeft = "10px";
        document.querySelector("td").style.paddingRight = "10px";
        document.querySelector("td").style.borderBottom = "1px solid #ddd";
        document.querySelector("td").style.borderTop = "1px solid #ddd";
        document.querySelector("td").style.borderLeft = "1px solid #ddd";
        document.querySelector("td").style.borderRight = "1px solid #ddd";

    </script>
</body>
</html>
