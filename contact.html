<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day-2-practice</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
  

    <!--CONTACT SECTION-->
    <section class="contact-section" id="contact">
        <h2>Book a Session</h2>
        <form action="submit">
            <label for="name">Full Name</label>
            <input type="text" name="name" id="fullName" placeholder="Enter your name" autocomplete="name" required>
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" autocomplete="email" required>
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone-number" id="phone" autocomplete="tel" required>
            <label for="message">Type your message</label>
            <textarea name="message" id="message" rows="6" minlength="20" maxlength="150" placeholder="Type your message" required></textarea>
            <button type="submit">Book Session Now</button>
        </form>
    </section>

    

    
</body>
</html>
